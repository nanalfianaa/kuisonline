    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #FFF8CC;
            background-image: radial-gradient(#FFE082 2px, transparent 2px);
            background-size: 24px 24px;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Claymorphism Base Styles */
        .clay-card {
            background: #FFFFFF;
            border: 4px solid #1565C0;
            border-radius: 30px;
            box-shadow: 0 12px 0 #0D47A1, 0 20px 30px rgba(0, 0, 0, 0.2);
        }

        .clay-header {
            background: #FFFFFF;
            box-shadow: 0 6px 0 #E0E0E0;
            border-radius: 20px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .clay-badge {
            background: #1565C0;
            box-shadow: 0 4px 0 #0D47A1;
            border-radius: 15px;
        }

        .clay-maskot {
            background: #FFEB3B;
            border: 3px solid #1565C0;
            box-shadow: 0 6px 0 #F9A825;
        }

        .clay-question {
            background: #E3F2FD;
            border-bottom: 6px solid #90CAF9;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 8px rgba(0,0,0,0.05);
            border-radius: 22px;
        }

        .clay-input {
            background: #F5F5F5;

            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1), 0 4px 0 #0D47A1;
            border-radius: 20px;

            border-bottom: 6px solid #FB8C00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            color: #E65100;
        }

        .clay-btn-choice {
            transition: all 0.1s ease;
        }
        .clay-btn-choice:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .clay-btn-choice:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .btn-start {
            background: #1565C0;
            box-shadow: 0 8px 0 #0D47A1, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .btn-start:hover {
            transform: translateY(-2px);
        }
        .btn-start:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0D47A1;
        }

        .btn-skip {
            background: linear-gradient(180deg, #FF9800 0%, #EF6C00 100%);
            box-shadow: 0 8px 0 #E65100, 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .btn-skip:hover {
            transform: translateY(-2px);
        }
        .btn-skip:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #E65100;
        }

        /* Correct / Wrong States */
        .clay-btn-choice.correct {
            background-color: #A5D6A7 !important;
            border-bottom: 6px solid #2E7D32 !important;
            color: #1B5E20 !important;
            animation: pop 0.5s ease-in-out;
        }

        .clay-btn-choice.wrong {
            background-color: #EF9A9A !important;
            border-bottom: 6px solid #C62828 !important;
            color: #B71C1C !important;
            animation: shake 0.4s ease-in-out;
        }

        /* Keyframes */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-float-slow {
            animation: floatSlow 4s ease-in-out infinite;
        }

        /* 3D Clay Figures CSS Artwork */
        .clay-avatar {
            width: 180px;
            height: 250px;
            position: relative;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.15));
        }

        /* Confetti Container */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        /* Floating Score Text Animation */
        @keyframes floatScore {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            50% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-100px) scale(1); }
        }

        .floating-score {
            position: fixed;

            font-size: 3rem;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            pointer-events: none;
            z-index: 90;
            animation: floatScore 1.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>

    <script>
        // Web Audio API Sound Generator (Zero External Sound Files Needed)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    // Happy Arpeggio
                    const now = audioCtx.currentTime;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'wrong') {
                    // Sad Low Buzzer
                    const now = audioCtx.currentTime;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(130, now + 0.15);

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'click') {
                    // Quick Soft Pop
                    const now = audioCtx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Quiz Data - Siklus Hidup Tumbuhan (10 Soal Pilihan Ganda)
        const questionsData = [

        let currentQuestionIndex = 0;

        // Button Class Styles Map

        // On Page Load Check Saved Name

        // Function 0: Start Button Handler with Validation
        function mulaiBelajar() {
            const input = document.getElementById('inputNama');

            if (!val) {
                // Validation: Shake Input
                input.classList.add('animate-bounce');
                input.style.borderColor = '#E53935';
                playSound('wrong');
                setTimeout(() => {
                    input.classList.remove('animate-bounce');
                    input.style.borderColor = '#1565C0';
                }, 800);
                return;
            }

            // Save Name to LocalStorage
            namaSiswa = val;
            localStorage.setItem('namaSiswa', namaSiswa);
            playSound('click');

            // Hide Welcome Screen with Fade Out
            const welcomeScreen = document.getElementById('welcome-screen');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                initGame();
            }, 500);
        }

        // Initialize Game State
        function initGame() {
            currentQuestionIndex = 0;
            score = 0;
            updateHeader();
            loadQuestion();
        }

        function updateHeader() {
            document.getElementById('player-greeting').innerHTML = `Halo, <span class="text-blue-700 font-bold">${namaSiswa}</span>! ⭐ Skor: <span id="score-val">${score}</span>`;
            document.getElementById('progress-text').innerText = `Soal ${currentQuestionIndex + 1}/${questionsData.length}`;
        }

        function loadQuestion() {
            isAnswering = false;
            const qData = questionsData[currentQuestionIndex];
            
            // Set Question Text
            const qEl = document.getElementById('question-text');
            qEl.innerText = qData.q;

            // Render Choices
            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = `clay-btn-choice ${btnStyles[index]} h-[65px] px-4 rounded-2xl font-bold text-left text-base sm:text-lg flex items-center gap-2 w-full`;
                btn.onclick = () => checkAnswer(index, btn);
                btn.innerHTML = `<span class="opacity-80">${optionPrefixes[index]}</span> <span>${optText}</span>`;
                container.appendChild(btn);
            });

            updateHeader();
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswering) return;
            isAnswering = true;

            const qData = questionsData[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.clay-btn-choice');

            if (selectedIndex === qData.answer) {
                // CORRECT ANSWER
                playSound('correct');
                btnElement.classList.add('correct');
                score += 10;
                
                // Show Floating Score Effect
                showFloatingScore(btnElement);
                
                // Show Confetti Effect
                showConfetti();

                // Update score text immediately
                document.getElementById('score-val').innerText = score;

            } else {
                // WRONG ANSWER
                playSound('wrong');
                btnElement.classList.add('wrong');

                // Highlight Correct Answer with Flash Effect
                setTimeout(() => {
                    if (allButtons[qData.answer]) {
                        allButtons[qData.answer].classList.add('correct');
                    }
                }, 300);
            }

            // Disable all option buttons
            allButtons.forEach(b => b.disabled = true);

            // Transition to Next Question after delay
            setTimeout(() => {
                nextQuestion();
            }, 1800);
        }

        function skipQuestion() {
            if (isAnswering) return;
            playSound('click');
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questionsData.length) {
                loadQuestion();
            } else {
                showResultScreen();
            }
        }

        function showFloatingScore(targetEl) {
            const rect = targetEl.getBoundingClientRect();
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-score';
            floatEl.innerText = '+10 ✨';
            floatEl.style.left = `${rect.left + rect.width / 2 - 40}px`;
            floatEl.style.top = `${rect.top - 20}px`;
            document.body.appendChild(floatEl);

            setTimeout(() => {
                floatEl.remove();
            }, 1200);
        }

        function showConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#FFEB3B', '#FF4081', '#00E676', '#00E5FF', '#AA00FF', '#FF9100'];

            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                const size = Math.random() * 10 + 8;
                const color = colors[Math.floor(Math.random() * colors.length)];

                particle.style.position = 'absolute';
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `-20px`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px';
                particle.style.animation = `confettiFall ${Math.random() * 1.5 + 1.5}s ease-out forwards`;

                container.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 3000);
            }
        }

        function showResultScreen() {
            const modal = document.getElementById('result-modal');
            const iconEl = document.getElementById('result-icon');
            const iconContainer = document.getElementById('result-icon-container');
            const titleEl = document.getElementById('result-title');
            const msgEl = document.getElementById('result-message');
            const badgeEl = document.getElementById('result-score-badge');

            // Logic Motivasi Berdasarkan Skor
            if (score >= 80) {
                titleEl.innerText = `Luar Biasa, ${namaSiswa}! 🏆`;
                msgEl.innerText = "Kamu Sangat Hebat! 🌟";
                badgeEl.innerText = `Hebat! Skor kamu ${score}!`;
                iconEl.innerText = "🏆";
                iconContainer.className = "w-24 h-24 mx-auto mb-4 rounded-full bg-yellow-100 flex items-center justify-center border-4 border-yellow-400 shadow-inner";
                showConfetti();
                playSound('correct');
            } else if (score >= 50) {
                titleEl.innerText = `Keren, ${namaSiswa}! 😊`;
                msgEl.innerText = "Bagus! Terus Berlatih Ya!";
                badgeEl.innerText = `Semangat! Skor kamu ${score}!`;
                iconEl.innerText = "⭐";
                iconContainer.className = "w-24 h-24 mx-auto mb-4 rounded-full bg-blue-100 flex items-center justify-center border-4 border-blue-400 shadow-inner";
                playSound('click');
            } else {
                titleEl.innerText = `Ayo Semangat, ${namaSiswa}! 💪`;
                msgEl.innerText = "Jangan Menyerah, Coba Lagi Ya!";
                badgeEl.innerText = `Skor kamu ${score}, yuk coba lagi!`;
                iconEl.innerText = "📚"; // Ganti ikon piala dengan buku/pensil
                iconContainer.className = "w-24 h-24 mx-auto mb-4 rounded-full bg-orange-100 flex items-center justify-center border-4 border-orange-400 shadow-inner";
                playSound('wrong');
            }

            modal.classList.remove('hidden');
        }

        function restartQuiz() {
            playSound('click');
            document.getElementById('result-modal').classList.add('hidden');
            initGame();
        }
    </script>
</body>
</html>
